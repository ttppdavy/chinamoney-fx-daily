name: Backfill China Money FX history

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to fill (YYYY-MM-DD)"
        required: true
        default: "2023-01-01"
      end_date:
        description: "Last date to fill (YYYY-MM-DD)"
        required: true
        default: "2026-08-30"

permissions:
  contents: write

concurrency:
  group: chinamoney-fx-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Backfill official historical curves
        run: PYTHONPATH=src python -m chinamoney_fx.backfill --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}"
      - name: Commit historical observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No historical observations added."
          else
            git commit -m "data: backfill China Money FX history"
            git push
          fi
