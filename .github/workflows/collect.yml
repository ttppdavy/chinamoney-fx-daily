name: Collect China Money FX data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
      - "src/**"
      - "requirements.txt"
      - "pyproject.toml"
  schedule:
    # GitHub cron is UTC. 09:20 UTC = 17:20 Beijing, after the 16:50 implied-rate
    # and 17:00 swap-curve publications. Weekdays only.
    - cron: "20 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: chinamoney-fx-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect and validate official data
        run: PYTHONPATH=src python -m chinamoney_fx.collect
      - name: Commit new observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new market data."
          else
            git commit -m "data: China Money FX $(date -u +'%Y-%m-%d')"
            git push
          fi
